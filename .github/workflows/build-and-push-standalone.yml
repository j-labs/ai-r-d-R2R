name: Build and Push Standalone Image

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GAR_LOCATION: europe-west1
  GAR_REPOSITORY: ai-r-d
  IMAGE_NAME: r2r-vllm

concurrency:
  group: standalone-docker-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push Dockerfile.standalone to Google Artifact Registry
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ai-r-d-467405
          workload_identity_provider: projects/159622693030/locations/global/workloadIdentityPools/ga-pool/providers/ai-r-d-provider
          service_account: github-actions@ai-r-d-467405.iam.gserviceaccount.com

      - name: Configure Docker to use gcloud as a credential helper
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Get provider name
        run: |
          gcloud iam workload-identity-pools providers list \
          --workload-identity-pool="ga-pool" \
          --location="global" \
          --project="ai-r-d-467405" \
          --format="table(name, displayName)"

      - name: Who am I?
        run: |
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud projects get-iam-policy ${{ vars.PROJECT_ID }} --format='flattened(bindings[].role,bindings[].members)' | grep ${{ vars.GOOGLE_SERVICE_ACCOUNT }} || true

      - name: Verify GAR repository exists
        run: |
          gcloud artifacts repositories describe "${{ env.GAR_REPOSITORY }}" \
            --location="${{ env.GAR_LOCATION }}" \
            --project="${{ vars.PROJECT_ID }}"

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=stable,enable=${{ github.ref_name == 'main' }}
            type=raw,value=bleeding,enable=${{ github.ref_name == 'develop' }}
            type=sha,enable=true

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.standalone
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
